<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twenty Languages, One Heart</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#260817,#050307 68%);color:#fff7fb;font-family:Georgia,serif;text-align:center}main{width:min(100%,760px);padding:20px}.eyebrow,.language,.counter,.hint{font: .75rem/1.5 system-ui,sans-serif;letter-spacing:.12em;color:#d8a2b8}.eyebrow{text-transform:uppercase;letter-spacing:.24em}.frame{width:min(92vw,640px);height:min(65vh,530px);min-height:280px;margin:12px auto}canvas{display:block;width:100%;height:100%;background:#050307}.phrase{font-size:clamp(1.3rem,4vw,2.4rem);color:#ffd1df;text-shadow:0 0 20px #ff477d55}.hint{opacity:.6;letter-spacing:normal}</style></head><body><main><p class="eyebrow">Twenty languages · one feeling</p><div class="frame"><canvas id="heart" aria-label="Glowing heart made of love phrases"></canvas></div><p class="phrase" id="phrase">I love you</p><p class="language" id="language">English</p><p class="counter" id="counter">01 / 20</p><p class="hint">A little heart, made of words.</p></main><script>
(()=>{'use strict';const words=[['English','I love you'],['Bangla','আমি তোমাকে ভালোবাসি'],['Bangla (Romanized)','Ami tomake bhalobashi'],['Spanish','Te amo'],['French','Je t’aime'],['German','Ich liebe dich'],['Italian','Ti amo'],['Portuguese','Eu te amo'],['Japanese','愛してる'],['Korean','사랑해'],['Chinese','我爱你'],['Hindi','मैं तुमसे प्यार करता हूँ'],['Urdu','میں تم سے محبت کرتا ہوں'],['Arabic','أحبك'],['Turkish','Seni seviyorum'],['Russian','Я тебя люблю'],['Greek','Σ’ αγαπώ'],['Thai','ฉันรักคุณ'],['Vietnamese','Anh yêu em'],['Indonesian','Aku cinta kamu']];const c=document.querySelector('#heart'),ctx=c.getContext('2d'),phrase=document.querySelector('#phrase'),lang=document.querySelector('#language'),counter=document.querySelector('#counter'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,palette=['#ff477d','#ff719b','#ff9fbd','#ff4e9b','#f8b6ff','#ff315e','#ffc2d6'];let pts=[],raf=0,start=performance.now(),last=-1;const heart=t=>({x:16*Math.sin(t)**3,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}),outline=Array.from({length:720},(_,i)=>heart(i/720*Math.PI*2));function inside(x,y){let hit=false;for(let i=0,j=outline.length-1;i<outline.length;j=i++){const a=outline[i],b=outline[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y+1e-9)+a.x)hit=!hit}return hit}function scatter(){pts=[];let n=0;while(pts.length<240&&n++<15000){let x=Math.random()*34-17,y=Math.random()*32-16;if(inside(x,y)){let w=words[Math.random()*words.length|0];pts.push({x,y,text:w[1],color:palette[Math.random()*palette.length|0],size:2.2+Math.random()*3,phase:Math.random()*6.28,delay:Math.random()*.7,alpha:.4+Math.random()*.5})}}}function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);scatter()}function draw(now){let w=c.clientWidth,h=c.clientHeight,t=(now-start)/1000,s=Math.min(w/38,h/36),cx=w/2,cy=h/2-6*s;ctx.clearRect(0,0,w,h);ctx.fillStyle='#050307';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.beginPath();outline.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.strokeStyle='#ff5d8f';ctx.lineWidth=.16;ctx.shadowColor='#ff2f70';ctx.shadowBlur=12+Math.sin(t*2)*5;ctx.stroke();ctx.restore();pts.forEach(p=>{let a=Math.min(1,Math.max(0,(t-p.delay)/1.8));if(!a)return;ctx.save();ctx.globalAlpha=a*p.alpha*(.65+.35*Math.sin(t*2+p.phase));ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=4+4*(.5+.5*Math.sin(t*1.7+p.phase));ctx.font=`${Math.max(6,Math.min(11,p.size+s*.35))}px ${/[^\u0000-\u00ff]/.test(p.text)?'system-ui,sans-serif':'Georgia,serif'}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,cx+p.x*s,cy+p.y*s);ctx.restore()});for(let i=0;i<20;i++){let a=t*.16+i*2.399,r=Math.min(w,h)*(.38+(i%4)*.022);ctx.globalAlpha=.2+.25*(.5+.5*Math.sin(t*2+i));ctx.fillStyle=palette[i%palette.length];ctx.fillRect(cx+Math.cos(a)*r,cy+Math.sin(a*1.13)*r*.62,1.5,1.5)}ctx.globalAlpha=1;let idx=Math.floor(t/(reduced?1.2:1.45))%words.length;if(idx!==last){last=idx;lang.textContent=words[idx][0];phrase.textContent=words[idx][1];counter.textContent=`${String(idx+1).padStart(2,'0')} / ${words.length}`}if(!reduced)raf=requestAnimationFrame(draw)}new ResizeObserver(resize).observe(c);resize();draw(performance.now());window.addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true})})();
</script></body></html>
